name: Configure flight API authentication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-auth-setup
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate or reuse the shared secret and configure Vapi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          FLIGHT_API_URL: ${{ vars.FLIGHT_API_URL }}
        run: python3 setup_flight_auth.py
